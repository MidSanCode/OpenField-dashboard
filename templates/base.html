<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OpenField Admin{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #f5f5f7;
      color: #1c1c1e;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #f2f2f7; }
      .card, .table th, .table td { background: #2c2c2e; border-color: #3a3a3c !important; }
      .sidebar { background: #2c2c2e; }
      .badge { color: #fff; }
      input, select, button { color-scheme: dark; }
    }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 200px; background: #fff; border-right: 1px solid #e5e5e5;
      padding: 16px 0; flex-shrink: 0;
    }
    .sidebar h1 { font-size: 18px; padding: 0 16px; margin: 0 0 16px; }
    .sidebar a {
      display: block; padding: 10px 16px; color: inherit; text-decoration: none;
    }
    .sidebar a:hover, .sidebar a.active { background: rgba(76, 175, 80, 0.12); }
    .sidebar .logout { margin-top: 24px; color: #d32f2f; }
    .main { flex: 1; padding: 24px; max-width: 1100px; }
    .card {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 10px;
      padding: 16px; margin-bottom: 16px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .stat { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 16px; }
    .stat .num { font-size: 26px; font-weight: 700; }
    .stat .label { color: #666; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    .table th, .table td { border-bottom: 1px solid #e5e5e5; padding: 10px 8px; text-align: left; font-size: 14px; }
    .table th { font-weight: 600; }
    input, select {
      padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; margin: 4px 4px 4px 0;
    }
    button, .btn {
      padding: 8px 14px; border: none; border-radius: 6px; background: #4caf50; color: #fff;
      cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block;
    }
    button.danger, .btn.danger { background: #d32f2f; }
    button:hover, .btn:hover { filter: brightness(0.92); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px;
    }
    .badge.admin { background: #4caf50; color: #fff; }
    .badge.user { background: #90a4ae; color: #fff; }
    .badge.pending { background: #ff9800; color: #fff; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; }
    .flash.success { background: #c8e6c9; color: #1b5e20; }
    .flash.error { background: #ffcdd2; color: #b71c1c; }
    .muted { color: #888; font-size: 13px; }
    .pagination a { margin-right: 8px; }
    .img-thumb { max-height: 40px; border-radius: 4px; vertical-align: middle; }
    @media (max-width: 700px) { .layout { flex-direction: column; } .sidebar { width: 100%; } }
  </style>
</head>
<body>
  <div class="layout">
    {% if session.admin_id %}
    <nav class="sidebar">
      <h1>OpenField Admin</h1>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">仪表盘</a>
      <a href="{{ url_for('users') }}" class="{{ 'active' if request.endpoint == 'users' or request.endpoint == 'user_new' }}">用户管理</a>
      <a href="{{ url_for('posts') }}" class="{{ 'active' if request.endpoint == 'posts' }}">帖子管理</a>
      <a href="{{ url_for('attachments') }}" class="{{ 'active' if request.endpoint == 'attachments' }}">附件管理</a>
      <a class="logout" href="{{ url_for('logout') }}">退出 ({{ session.admin_username }})</a>
    </nav>
    {% endif %}
    <main class="main">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
