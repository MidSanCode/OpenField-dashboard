{% extends "base.html" %}
{% block title %}登录 - OpenField Admin{% endblock %}
{% block content %}
<div class="card p-4 shadow-sm">
  <div class="text-center mb-4">
    <div class="mx-auto mb-2 d-flex align-items-center justify-content-center rounded-3 text-white" style="width: 56px; height: 56px; background: #1f2937;">
      <i class="bi bi-boxes" style="font-size: 1.6rem;"></i>
    </div>
    <h1 class="h4 mb-1 fw-bold">OpenField Admin</h1>
    <p class="text-muted mb-0 small">管理员登录</p>
  </div>
  <form method="post">{{ csrf_input }}
    <div class="mb-3">
      <label class="form-label" for="username">用户名</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="请输入用户名">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">密码</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" class="form-control" id="password" name="password" required placeholder="请输入密码">
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>登录</button>
  </form>
</div>
{% endblock %}
